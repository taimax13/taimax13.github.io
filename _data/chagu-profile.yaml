title: "ChaGu – The Secure AI Guardian"

summary: >
  ChaGu (ChainGuard) is a secure, blockchain-backed protocol designed to protect, observe, and guide AI interactions across data pipelines. 
  From monitoring whispering machines to shielding you from malicious LLM-generated time bombs, ChaGu evolves with your infrastructure.

