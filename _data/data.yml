    details: '- Designed, implemented, and maintained scalable infrastructure using Infrastructure as Code (Terraform,
      Ansible), and container orchestration systems like Kubernetes (AKS, EKS, GKE).

      - Developed and optimized continuous integration and delivery pipelines for seamless code deployments, reducing
      manual intervention and increasing efficiency across environments.

      - Managed cloud infrastructures on AWS, Azure, and GCP, focusing on high availability, security, and cost-efficiency
      in production environments.

      - ML workflows using platforms like SageMaker, Kubeflow, and MLflow. Automated model training, validation,
      and deployment processes, ensuring efficient scaling of machine learning models in production.

      - Worked closely with data science and development teams to ensure smooth integration of ML models into production
      environments, ensuring performance, reliability, and scalability.

      -  Implemented monitoring solutions (Prometheus, Grafana, Datadog) for both infrastructure and ML models to
      ensure proactive issue detection and resolution, including anomaly detection for model behavior.

      -  Enforced security best practices across infrastructure, including the setup of automated vulnerability
      scans, access management, and data encryption.

